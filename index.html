  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #0F2B25;   /* deep bottle green */
      --paper:  #EEF1EC;   /* bars and main text */
      --muted:  #9DB3A8;
      --rule:   #2E4D44;
      --octave: #D2A23A;   /* the eighth note */
      --shade:  #133229;   /* backdrop columns, one step above the ground */
      --rise:   46vh;      /* backdrop: height of the first column; the eighth is twice it */

      --latin: "Zain", "Segoe UI", Tahoma, sans-serif;
      --arabic: "Zain", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;

      /* The logo is sized from the viewport so it reads as architecture, not as an icon. */
      --logo: min(50vw, 86vh, 820px);
      --edge: clamp(22px, 5vw, 80px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--paper);
      font-family: var(--arabic);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Backdrop: the same eight columns, faint, standing on the bottom edge of the screen
       (the motif of the social covers). Decorative only. */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      direction: ltr;
      display: flex;
      align-items: flex-end;
      gap: 1.4vw;
    }
    .backdrop span {
      flex: 1 1 0;
      height: calc(var(--rise) * var(--r));
      background: var(--shade);
    }
    .backdrop .eighth {
      position: relative;
      background: transparent;
      box-shadow: inset 0 0 0 max(2px, .2vw) rgba(210, 162, 58, .24);
    }
    .backdrop .eighth::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 62%;
      background: rgba(210, 162, 58, .10);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0 var(--edge);
    }

    /* Stage: words at the start side, the octave at the end side,
       both standing on the same ground line. */
    .stage {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(28px, 5vw, 80px);
      padding-top: clamp(40px, 9vh, 110px);
      border-bottom: 1px solid var(--rule);
    }

    .words {
      flex: 1 1 26rem;
      max-width: 34rem;
      padding-bottom: clamp(28px, 6vh, 64px);
    }

    /* The name lives on the columns: the logo is the heading. */
    .logo {
      flex: 0 0 auto;
      margin: 0;
      width: var(--logo);
      padding-bottom: clamp(28px, 6vh, 64px);
      direction: ltr;
      line-height: 0;
    }
    .logo svg {
      display: block;
      width: 100%;
      height: auto;
      animation: rise 900ms cubic-bezier(.2, .7, .2, 1) 150ms both;
    }
    .logo .min { display: none; }
    .sr {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .promise {
      margin: clamp(18px, 3vh, 30px) 0 0;
      font-size: clamp(1.5rem, 2.3vw, 2.1rem);
      font-weight: 700;
      line-height: 1.7;
    }
    .promise span { display: block; white-space: nowrap; }

    .status {
      margin: clamp(26px, 5vh, 48px) 0 0;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.7;
    }
    .status strong {
      display: block;
      color: var(--octave);
      font-weight: 700;
      font-size: 1.3rem;
    }
    .status [lang="en"] {
      display: block;
      direction: ltr;
      text-align: right;
      font-family: var(--latin);
      font-weight: 300;
    }

    @keyframes rise {
      from { clip-path: inset(100% 0 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 18px 0 22px;
      direction: ltr;
      color: var(--muted);
      font-family: var(--latin);
      font-size: 1.1rem;
    }
    .social {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 22px;
    }
    .social a {
      color: var(--muted);
      text-decoration: none;
      padding: 6px 0;
      transition: color .15s;
    }
    .social a:hover { color: var(--paper); }
    footer .mail {
      color: var(--paper);
      text-decoration-color: var(--octave);
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }
    footer a:focus-visible {
      color: var(--paper);
      outline: 2px solid var(--octave);
      outline-offset: 4px;
      border-radius: 2px;
    }

    /* Narrow and tall screens: words on top, the logo across the full width below. */
    @media (max-width: 860px), (orientation: portrait) {
      :root { --logo: 100%; --rise: 27vh; }
      .stage {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: clamp(32px, 7vh, 72px);
      }
      .words { flex: 0 0 auto; max-width: none; padding-bottom: 0; }
      .logo { max-width: 560px; padding-bottom: clamp(22px, 4vh, 40px); }
      .promise { font-size: clamp(1.1rem, 5.2vw, 1.8rem); }
      footer { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
      .social { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0 26px; }
      .social a { padding: 11px 0; }
    }

    /* Below 320px of logo width the tagline stops being readable: show the logo without it. */
    @media (max-width: 363px) {
      .logo .full { display: none; }
      .logo .min  { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo svg { animation: none; }
    }
  </style>
