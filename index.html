<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octovel | الموقع قيد التطوير</title>
  <meta name="description" content="Octovel: عقد واحد. فريق خبراء واحد. تطوير شامل لكل أقسام مؤسستك. الموقع قيد التطوير.">
  <meta name="theme-color" content="#0F2B25">
  <meta property="og:title" content="Octovel">
  <meta property="og:description" content="عقد واحد. فريق خبراء واحد. تطوير شامل لكل أقسام مؤسستك.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F2B25'/%3E%3Cg fill='%23EEF1EC'%3E%3Crect x='6' y='18' width='4' height='8'/%3E%3Crect x='12' y='15' width='4' height='11'/%3E%3Crect x='18' y='12' width='4' height='14'/%3E%3C/g%3E%3Crect x='24' y='8' width='4' height='18' fill='%23D2A23A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #0F2B25;   /* deep bottle green */
      --paper:  #EEF1EC;   /* bars and main text */
      --muted:  #9DB3A8;
      --rule:   #2E4D44;
      --octave: #D2A23A;   /* the eighth note */

      --latin: "Zain", "Segoe UI", Tahoma, sans-serif;
      --arabic: "Zain", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;

      /* The octave is sized from the viewport so it reads as architecture, not as an icon. */
      --unit: min(30vh, 14.5vw);          /* height of the first note */
      --bar:  min(4.8vw, 70px);
      --gap:  min(1.5vw, 22px);
      --edge: clamp(22px, 5vw, 80px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--paper);
      font-family: var(--arabic);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0 var(--edge);
    }

    /* Stage: words at the start side, the octave at the end side,
       both standing on the same ground line. */
    .stage {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(28px, 5vw, 80px);
      padding-top: clamp(40px, 9vh, 110px);
      border-bottom: 1px solid var(--rule);
    }

    .words {
      flex: 1 1 26rem;
      max-width: 34rem;
      padding-bottom: clamp(28px, 6vh, 64px);
    }

    .name {
      direction: ltr;
      text-align: right;
      margin: 0;
      font-family: var(--latin);
      font-weight: 800;
      font-size: clamp(3.8rem, 9.4vw, 8.6rem);
      line-height: 0.9;
      letter-spacing: 0.005em;
    }

    .promise {
      margin: clamp(18px, 3vh, 30px) 0 0;
      font-size: clamp(1.35rem, 2.05vw, 1.9rem);
      font-weight: 400;
      line-height: 1.7;
    }
    .promise span { display: block; }

    .status {
      margin: clamp(26px, 5vh, 48px) 0 0;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.7;
    }
    .status strong {
      display: block;
      color: var(--octave);
      font-weight: 700;
      font-size: 1.3rem;
    }
    .status [lang="en"] {
      display: block;
      direction: ltr;
      text-align: right;
      font-family: var(--latin);
      font-weight: 300;
    }

    /* The octave: eight bars with the true ratios of a major scale.
       Seven are built. The eighth, exactly twice the first, is still going up. */
    .octave {
      flex: 0 0 auto;
      direction: ltr;
      display: flex;
      align-items: flex-end;
      gap: var(--gap);
      height: calc(var(--unit) * 2);
    }
    .octave span {
      display: block;
      width: var(--bar);
      height: calc(var(--unit) * var(--r));
      background: var(--paper);
      transform-origin: bottom;
      animation: rise 640ms cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--i) * 85ms + 150ms);
    }
    .octave .eighth {
      position: relative;
      background: transparent;
      box-shadow: inset 0 0 0 2px var(--octave);
    }
    .octave .eighth::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 62%;
      background: var(--octave);
      transform-origin: bottom;
      animation: rise 1400ms cubic-bezier(.3, .6, .2, 1) both;
      animation-delay: 1150ms;
    }

    @keyframes rise {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 18px 0 22px;
      direction: ltr;
      color: var(--muted);
      font-family: var(--latin);
      font-size: 1.1rem;
    }
    footer a {
      color: var(--paper);
      text-decoration-color: var(--octave);
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }
    footer a:focus-visible {
      outline: 2px solid var(--octave);
      outline-offset: 4px;
      border-radius: 2px;
    }

    /* Narrow and tall screens: words on top, the octave across the full width below. */
    @media (max-width: 860px), (orientation: portrait) {
      :root {
        --unit: min(15vh, 27vw);
        --bar:  calc((100vw - var(--edge) * 2 - var(--gap) * 7) / 8);
        --gap:  min(2.6vw, 14px);
      }
      .stage {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: clamp(32px, 7vh, 72px);
      }
      .words { flex: 0 0 auto; max-width: none; padding-bottom: 0; }
      .name { font-size: clamp(3.6rem, 19vw, 6.6rem); }
      .promise { font-size: clamp(1.3rem, 5.2vw, 1.7rem); }
      footer { flex-direction: column-reverse; align-items: flex-start; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .octave span, .octave .eighth::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="stage">
      <div class="words">
        <h1 class="name" lang="en">Octovel</h1>

        <p class="promise">
          <span>عقد واحد. فريق خبراء واحد.</span>
          <span>تطوير شامل لكل أقسام مؤسستك.</span>
        </p>

        <p class="status">
          <strong>الموقع قيد التطوير</strong>
          <span lang="en">Our website is being built.</span>
        </p>
      </div>

      <div class="octave" role="img" aria-label="ثماني درجات صاعدة؛ سبع مكتملة والثامنة، وهي ضعف الأولى، قيد البناء">
        <span style="--i:0; --r:1"></span>
        <span style="--i:1; --r:1.125"></span>
        <span style="--i:2; --r:1.25"></span>
        <span style="--i:3; --r:1.3333"></span>
        <span style="--i:4; --r:1.5"></span>
        <span style="--i:5; --r:1.6667"></span>
        <span style="--i:6; --r:1.875"></span>
        <span class="eighth" style="--i:7; --r:2"></span>
      </div>
    </main>

    <footer>
      <span>© 2026 Octovel</span>
      <a href="mailto:info@octovel.com">info@octovel.com</a>
    </footer>
  </div>
</body>
</html>
